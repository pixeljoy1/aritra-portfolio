<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aritra: Human Respiratory XR</title>
  <!-- Pinned A-Frame release. WebXR needs HTTPS; GitHub Pages provides it. -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="museum-display.js?v=3"></script>
  <style>
    /* Flat-view overlays. The Quest has no console, so status and errors are printed on the page. */
    #brand { position: fixed; left: 12px; top: 12px; z-index: 10; display: flex; align-items: center; gap: 8px;
             font: 600 13px/1 system-ui, sans-serif; color: #bff6ff; pointer-events: none; }
    #brand .pill { padding: 3px 7px; font: 700 10px/1 system-ui, sans-serif; letter-spacing: .06em; color: #050811;
                   background: #00e5ff; border-radius: 999px; }
    #status { position: fixed; left: 12px; top: 40px; z-index: 10; padding: 6px 10px;
              font: 13px/1.3 system-ui, sans-serif; color: #fff; background: rgba(5,8,17,.7);
              border: 1px solid rgba(0,229,255,.35); border-radius: 6px; pointer-events: none; max-width: 70vw; }
    #status.done { opacity: 0; transition: opacity 1.5s 4s; }
    #status.error { background: #a01818; opacity: 1; }
    #reset-btn { position: fixed; right: 12px; top: 12px; z-index: 10; padding: 7px 14px;
                 font: 600 13px system-ui, sans-serif; color: #fff; background: rgba(5,8,17,.7);
                 border: 1px solid rgba(0,229,255,.5); border-radius: 6px; cursor: pointer; }
    #reset-btn:hover { background: #b3261e; }
    #hud { position: fixed; right: 12px; bottom: 64px; z-index: 10; max-width: 340px; padding: 8px 10px;
           font: 12px/1.45 ui-monospace, Menlo, monospace; color: #9fe9f5; background: rgba(5,8,17,.7);
           border: 1px solid rgba(0,229,255,.3); border-radius: 6px; pointer-events: none; white-space: pre-line; }
    @media (max-width: 640px) { #hud { display: none; } }
    .shot #brand, .shot #status, .shot #hud, .shot #reset-btn { display: none; }
  </style>
</head>
<body>
  <div id="brand">Human Respiratory XR <span class="pill">v1.05</span></div>
  <div id="status">Loading the anatomy…</div>
  <button id="reset-btn" type="button" title="Reset the experience (R)">Reset</button>
  <div id="hud"></div>

  <a-scene id="scene" background="color: #050811" renderer="colorManagement: true; antialias: true"
           loading-screen="enabled: false">

    <!-- Lighting rig from the spec: dark ambient, cyan key, violet rim -->
    <a-entity light="type: ambient; color: #081426; intensity: 0.4"></a-entity>
    <a-entity light="type: directional; color: #00e5ff; intensity: 1.2" position="1 3 2"></a-entity>
    <a-entity light="type: directional; color: #7a42f4; intensity: 2.0" position="-1 2 -2"></a-entity>

    <a-entity id="floor" holo-floor></a-entity>

    <!-- The anatomy. Its origin is the carina, the point where the trachea splits. Scaling pivots here. -->
    <a-entity id="model" respiratory-model position="0 1.4 -1.2">
      <a-entity id="anatomy" gltf-model="url(humanRespiratoryXR.glb?v=1)"></a-entity>
    </a-entity>

    <!-- Reset dialog (same behaviour as the Kerala house). Opens in front of you: Y button, R key or the Reset button. -->
    <a-entity id="dialog" visible="false">
      <a-plane color="#050811" opacity="0.9" width="2.0" height="1.0" position="0 0 -0.01"></a-plane>
      <a-text value="RESET THE EXPERIENCE?" align="center" color="#00e5ff" position="0 0.33 0" width="1.8"></a-text>
      <a-text value="Takes you back to the start and&#10;reloads the anatomy." align="center" color="#ddd"
              position="0 0.1 0" width="1.5"></a-text>
      <a-plane id="dlg-yes" color="#b3261e" width="0.8" height="0.3" position="-0.45 -0.27 0">
        <a-text value="RESET" align="center" position="0 0 0.01" width="1.4"></a-text>
      </a-plane>
      <a-plane id="dlg-no" color="#33415c" width="0.8" height="0.3" position="0.45 -0.27 0">
        <a-text value="CANCEL" align="center" position="0 0 0.01" width="1.4"></a-text>
      </a-plane>
    </a-entity>

    <!-- Player rig: moving the rig moves the player, never the camera itself -->
    <a-entity id="rig" position="0 0 0" museum-rig museum-pointer app-controls holo-ui>
      <a-camera id="cam" wasd-controls="enabled: false"></a-camera>
      <!-- Both hands: visible laser + trigger = panel buttons. Either stick to the side circles the organ, forward/back moves closer/further. -->
      <a-entity id="lhand" oculus-touch-controls="hand: left"></a-entity>
      <!-- Right stick forward/back = rise / lower. -->
      <a-entity id="rhand" oculus-touch-controls="hand: right"></a-entity>
    </a-entity>
  </a-scene>

  <noscript>This XR experience needs JavaScript and a WebXR browser such as the Meta Quest Browser.</noscript>

  <script>
    var T = AFRAME.THREE;
    function $(id) { return document.getElementById(id); }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function dead(v) { var a = Math.abs(v); return a < 0.15 ? 0 : Math.sign(v) * (a - 0.15) / 0.85; }
    function wrapPi(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
    function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }

    var QS = new URLSearchParams(location.search);     // ?aim=<deg> (tilt the controller aim) is read by museum-display.js

    // ---------------------------------------------------------------
    // Shared app state. The panel, keys, labels and controllers all change this one object.
    // ---------------------------------------------------------------
    var SCALE_MIN = 0.3, SCALE_MAX = 40;               // spec says 4x; 40x lets you fly inside a 2 cm trachea
    var ISO = ['ALL', 'AIRWAY', 'TRACHEA', 'LUNGS', 'BRONCHI', 'HEART', 'DIAPHRAGM'];
    var PRESET_ORDER = ['clinical', 'xray', 'solid'];
    var PRESET_NAME = { clinical: 'CLINICAL', xray: 'DEEP X-RAY', solid: 'SOLID' };
    var EXPLODE_STEPS = [0, 0.5, 1];
    var BPM_STEPS = [6, 12, 18];
        var APP = {
      scale: 1, scaleT: 1, spin: 0, auto: false, explodeIdx: 0, explode: 0, iso: 'ALL', preset: 'clinical',
      bpm: 12, labels: true, audio: false, anchor: 'dock', hover: null,
      orbit: 0, func: false, funcDone: false, orbitAcc: 0, focusDone: false
    };
        var TWO_PI = Math.PI * 2;
    var FOCUS_MIN = { lungs: 0.62, heart: 0.85, diaphragm: 0.62, airway: 0.92, trachea: 0.95, bronchi: 1.0 };   // the focused organ is lifted, the rest go translucent
    var CAPTION = {
      ALL: 'Pick an organ above to focus on it. You glide to it, everything else turns translucent, and you finish two tasks: circle it, then run its function.',
      AIRWAY: 'Upper airway: the nose, mouth, pharynx and larynx warm and filter air before it reaches the trachea.',
      TRACHEA: 'Trachea: about 12 cm long and held open by C-shaped cartilage rings. It splits into two bronchi at the carina.',
      LUNGS: 'Lungs: the right has 3 lobes, the left has 2 to make room for the heart. About 2.4 to 2.9 L of air in quiet breathing.',
      BRONCHI: 'Bronchial tree: the airways keep dividing, about 23 times, down to the alveoli where oxygen enters the blood. 8 paths left, 10 right.',
      HEART: 'Heart: sits between the lungs, tilted to the left. The left lung has a notch cut out for it.',
      DIAPHRAGM: 'Diaphragm: the main breathing muscle. It flattens and drops on inhale, and domes back up on exhale.'
    };

    function model() { return $('model').components['respiratory-model']; }
    function loco() { return $('rig').components['app-controls']; }
    function ui() { return $('rig').components['holo-ui']; }
    function dirtyPanel() { var u = ui(); if (u) u.dirty = true; }
    function speak(text) {
      try {
        if (!APP.audio || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text); u.rate = 0.95; window.speechSynthesis.speak(u);
      } catch (e) {}
    }
    var FUNC_TEXT = {
      AIRWAY: 'Function: warm, moisten and filter the air. Watch the airflow on the path from nose to larynx.',
      TRACHEA: 'Function: carry air down to the carina through rings that keep it open. Watch the airflow.',
      BRONCHI: 'Function: split the air into ever finer branches that end in the alveoli. Watch the airflow.',
      LUNGS: 'Function: swell and shrink to move air and swap gases. The breath is shown stronger.',
      HEART: 'Function: pump blood through the lungs and body. The heartbeat is shown stronger and slower.',
      DIAPHRAGM: 'Function: contract and drop to draw air in, relax and rise to push it out. The motion is shown stronger.'
    };
    // Focus an organ (or ALL to leave focus): glide to it, fade the rest to translucent, reset its tasks.
    function focusOrgan(name) {
      APP.iso = name; APP.func = false; APP.funcDone = false; APP.orbitAcc = 0; APP.orbit = 0; APP.focusDone = false;
      var L = loco(); if (L) L.frame(name);
      dirtyPanel(); speak(CAPTION[name]);
    }
    function setIso(name) { focusOrgan(name); }
    function checkFocusDone() {
      if (APP.iso === 'ALL' || APP.focusDone || APP.orbitAcc < TWO_PI || !APP.funcDone) return;
      APP.focusDone = true; dirtyPanel(); speak('Focus complete. Pick the next organ.');
      var u = ui(); if (u) u.haptic(0.8, 90);
    }

    var ACT = {
      scaleUp: function () { APP.scaleT = clamp(APP.scaleT * 1.25, SCALE_MIN, SCALE_MAX); },
      scaleDown: function () { APP.scaleT = clamp(APP.scaleT / 1.25, SCALE_MIN, SCALE_MAX); },
      rotate: function () { APP.auto = !APP.auto; },
      explode: function () { APP.explodeIdx = (APP.explodeIdx + 1) % EXPLODE_STEPS.length; },
      isolate: function () { setIso(ISO[(ISO.indexOf(APP.iso) + 1) % ISO.length]); },
      orbit: function () { var o = [0, 1, -1]; APP.orbit = o[(o.indexOf(APP.orbit) + 1) % 3]; },
      func: function () {
        if (APP.iso === 'ALL') return;
        APP.func = !APP.func;
        if (APP.func) { APP.funcDone = true; speak(FUNC_TEXT[APP.iso]); checkFocusDone(); }
      },
      view: function () { APP.preset = PRESET_ORDER[(PRESET_ORDER.indexOf(APP.preset) + 1) % PRESET_ORDER.length]; },
      breath: function () { APP.bpm = BPM_STEPS[(BPM_STEPS.indexOf(APP.bpm) + 1) % BPM_STEPS.length]; },
      speed: function () { var L = loco(); if (L) L.speedIdx = (L.speedIdx + 1) % SPEEDS.length; },
      labels: function () { APP.labels = !APP.labels; },
      exit: function () { focusOrgan('ALL'); },
      home: function () { APP.scaleT = 1; APP.spin = 0; APP.auto = false; rigC().home(); focusOrgan('ALL'); },
      audio: function () {
        APP.audio = !APP.audio;
        try { if (!APP.audio && window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
        if (APP.audio) speak(CAPTION[APP.iso]);
      },
      anchor: function () { var u = ui(); if (u) u.toggleAnchor(); }
    };
    ISO.forEach(function (c) { ACT['f_' + c] = function () { focusOrgan(c); }; });
    function act(name) { if (ACT[name]) { ACT[name](); dirtyPanel(); } }

    function disposeTree(root) {
      root.traverse(function (o) {
        if (o.geometry) o.geometry.dispose();
        var ms = Array.isArray(o.material) ? o.material : [o.material];
        ms.forEach(function (m) {
          if (!m) return;
          for (var k in m) { var v = m[k]; if (v && v.isTexture) v.dispose(); }
          m.dispose();
        });
      });
    }

    // ---------------------------------------------------------------
    // Text sprites (labels, ruler, readouts). Sprites always face the viewer.
    // ---------------------------------------------------------------
    function textSprite(text, o) {
      var c = document.createElement('canvas'); c.width = o.w; c.height = o.h;
      var tex = new T.CanvasTexture(c); tex.colorSpace = T.SRGBColorSpace;
      var s = new T.Sprite(new T.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false, toneMapped: false }));
      s.userData.o = o; s.userData.canvas = c;
      s.scale.set(o.sw, o.sw * o.h / o.w, 1); s.renderOrder = 20;
      redrawSprite(s, text); return s;
    }
    function redrawSprite(s, text) {
      var o = s.userData.o, c = s.userData.canvas, g = c.getContext('2d');
      g.clearRect(0, 0, o.w, o.h);
      if (o.box) {
        g.fillStyle = 'rgba(8,20,36,0.86)'; g.strokeStyle = '#4cc7e6'; g.lineWidth = 3;
        g.beginPath(); g.roundRect(3, 3, o.w - 6, o.h - 6, 8); g.fill(); g.stroke();
      }
      var px = o.font;
      g.textBaseline = 'middle'; g.textAlign = o.align || 'center';
      do { g.font = '600 ' + px + 'px system-ui, sans-serif'; px -= 2; } while (g.measureText(text).width > o.w - 24 && px > 10);
      g.fillStyle = o.color || '#e8fbff';
      g.fillText(text, o.align === 'left' ? 12 : o.w / 2, o.h / 2 + 2);
      s.material.map.needsUpdate = true; s.userData.text = text;
    }

    // ---------------------------------------------------------------
    // The anatomy comes from humanRespiratoryXR.glb (modelled in Blender, lighting baked into the vertex colours).
    // Every mesh in the file carries xr_cat (isolate group), xr_key (opacity layer), xr_group (explode group) and xr_ex (explode offset).
    // The page draws everything UNLIT, so the baked light is exactly what you see, on every headset.
    // Coordinates: glTF axes, metres, origin at the carina. The patient faces +Z (towards you); the patient's RIGHT is on your left (-x).
    // ---------------------------------------------------------------
    var PRESETS = {
      clinical: { torso: 0.05, wire: 0.30, ribs: 0.34, airway: 0.80, trachea: 0.90, bronchi: 1.0, lungs: 0.42, heart: 0.62, diaphragm: 0.36 },
      xray:     { torso: 0.01, wire: 0.10, ribs: 0.50, airway: 0.80, trachea: 0.90, bronchi: 1.0, lungs: 0.14, heart: 0.40, diaphragm: 0.22 },
      solid:    { torso: 0.00, wire: 0.40, ribs: 0.45, airway: 0.90, trachea: 0.95, bronchi: 1.0, lungs: 0.80, heart: 0.88, diaphragm: 0.65 }
    };
    var ADDITIVE = { torso: 1, wire: 1, ribs: 1, airway: 1, trachea: 1, bronchi: 1 };       // glowing layers add light; solid-ish organs blend normally
    var MODEL_URL = 'humanRespiratoryXR.glb?v=1', PATHS_URL = 'airflow_paths.json?v=1';
    var PIVOT = { lungR: [-0.088, -0.055, -0.004], lungL: [0.088, -0.055, -0.004], heart: [0.035, -0.095, 0.045], diaphragm: [0, -0.2, 0] };

    AFRAME.registerComponent('respiratory-model', {
      init: function () {
        var self = this;
        this.ready = false; this.root = null; this.fades = []; this.labelList = []; this.parts = {}; this.phase = null; this.volClock = 0;
        this.anat = $('anatomy');
        this.anat.addEventListener('model-loaded', function () { self.setup(); });
        this.anat.addEventListener('model-error', function () { statusEl.textContent = 'Could not load the anatomy model'; statusEl.className = 'error'; });
        fetch(PATHS_URL).then(function (r) { return r.json(); }).then(function (j) { self.pathData = j.paths; if (self.pendingFlow) self.buildAirflow(); })
          .catch(function () { statusEl.textContent = 'Could not load airflow paths'; statusEl.className = 'error'; });
        if (this.anat.getObject3D('mesh')) this.setup();
      },

      setup: function () {
        var self = this, src = this.anat.getObject3D('mesh'); if (!src || this.ready) return;
        var root = this.root = new T.Group(); this.fades = []; this.labelList = []; this.parts = {};
        function fade(key, cat, mat, objs) { self.fades.push({ key: key, cat: cat, mat: mat, objs: objs, cur: -1 }); }
        function part(name, ex) {
          if (self.parts[name]) return self.parts[name];
          var g = new T.Group(); g.name = name; root.add(g);
          var p = { g: g, ex: new T.Vector3(ex[0], ex[1], ex[2]), pivot: null };
          if (PIVOT[name]) {                                  // breathing scales about the organ's centre, not the carina
            p.pivot = new T.Group(); p.pivot.position.set(PIVOT[name][0], PIVOT[name][1], PIVOT[name][2]); g.add(p.pivot);
          }
          return (self.parts[name] = p);
        }
        var raw = []; src.traverse(function (o) { if (o.isMesh) raw.push(o); });
        // merge the Blender objects that share a group and an opacity layer: ~29 draw calls become ~12
        var buckets = {};
        raw.forEach(function (m) { var u = m.userData || {}, id = (u.xr_group || 'torso') + '|' + (u.xr_key || 'torso'); (buckets[id] = buckets[id] || []).push(m); });
        var meshes = [];
        for (var bid in buckets) {
          var list = buckets[bid], u0 = list[0].userData, sh = PIVOT[u0.xr_group] || [0, 0, 0], n = 0, ni = 0;
          list.forEach(function (m) { var g = m.geometry; n += g.attributes.position.count; ni += g.index ? g.index.count : g.attributes.position.count; });
          var cs = list[0].geometry.attributes.color ? list[0].geometry.attributes.color.itemSize : 0;
          var Pp = new Float32Array(n * 3), Cc = cs ? new Float32Array(n * cs) : null, Ii = new Uint32Array(ni), o = 0, oi = 0;
          list.forEach(function (m) {
            var g = m.geometry, pa = g.attributes.position, ca = g.attributes.color, ix = g.index, i, k;
            for (i = 0; i < pa.count; i++) {
              Pp[(o + i) * 3] = pa.getX(i) - sh[0]; Pp[(o + i) * 3 + 1] = pa.getY(i) - sh[1]; Pp[(o + i) * 3 + 2] = pa.getZ(i) - sh[2];
              if (Cc) for (k = 0; k < cs; k++) Cc[(o + i) * cs + k] = ca.getComponent(i, k);
            }
            var cnt = ix ? ix.count : pa.count;
            for (i = 0; i < cnt; i++) Ii[oi + i] = (ix ? ix.getX(i) : i) + o;
            oi += cnt; o += pa.count;
          });
          var geo = new T.BufferGeometry();
          geo.setAttribute('position', new T.BufferAttribute(Pp, 3)); if (Cc) geo.setAttribute('color', new T.BufferAttribute(Cc, cs)); geo.setIndex(new T.BufferAttribute(Ii, 1));
          var mm = new T.Mesh(geo, new T.MeshBasicMaterial()); mm.name = bid; mm.userData = u0; meshes.push(mm);
        }
        raw.forEach(function (m) { if (m.geometry) m.geometry.dispose(); });
        var mats = {};                                          // one material per (opacity layer, blending)
        function mat(key, wire) {
          var id = key + (wire ? '#w' : '');
          if (!mats[id]) {
            mats[id] = new T.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: PRESETS.clinical[key], depthWrite: false,
              side: T.DoubleSide, wireframe: !!wire, blending: ADDITIVE[key] ? T.AdditiveBlending : T.NormalBlending, toneMapped: false });
            mats[id].userData.key = key; mats[id].userData.objs = [];
          }
          return mats[id];
        }
        meshes.forEach(function (m) {
          var u = m.userData || {}, grp = u.xr_group || 'torso', key = u.xr_key || 'torso', cat = u.xr_cat || 'TORSO', ex = u.xr_ex || [0, 0, 0];
          var p = part(grp, ex), host = p.pivot || p.g;
          var objs = [];
          if (key === 'torso') {                               // the body: faint fill plus a wire grid of the same mesh
            var wm = new T.Mesh(m.geometry, mat('wire', true)); wm.renderOrder = 1; host.add(wm); mat('wire', true).userData.objs.push(wm); mat('wire', true).userData.cat = 'TORSO';
            m.material = mat('torso'); m.renderOrder = 1; mat('torso').userData.objs.push(m); mat('torso').userData.cat = 'TORSO';
          } else {
            m.material = mat(key); mat(key).userData.objs.push(m); mat(key).userData.cat = cat;
            m.renderOrder = { ribs: 1, lungs: 2, heart: 2, diaphragm: 2, airway: 3, trachea: 3, bronchi: 3 }[key] || 2;
          }
          host.add(m); m.frustumCulled = false;
        });
        for (var id in mats) { var mt = mats[id]; fade(mt.userData.key, mt.userData.cat, mt, mt.userData.objs); }
        this.heart = this.parts.heart.pivot; this.dia = this.parts.diaphragm.pivot;
        this.lungPivots = [this.parts.lungR.pivot, this.parts.lungL.pivot];
        this.anat.removeObject3D('mesh');

        // ----- labels, leader lines, ruler -----
        this.hud = new T.Group(); root.add(this.hud);
        function V(a) { return new T.Vector3(a[0], a[1], a[2]); }
        function label(text, grp, cat, anchor, at) {
          var sp = textSprite(text, { w: 320, h: 64, sw: 0.15, font: 26, box: true });
          sp.position.set(at[0], at[1], at[2]); sp.userData.cat = cat;
          var line = new T.Line(new T.BufferGeometry().setFromPoints([V(anchor), V(at)]),
            new T.LineBasicMaterial({ color: 0x5fd6ff, transparent: true, opacity: 0.6, depthTest: false, depthWrite: false }));
          var dot = new T.Mesh(new T.SphereGeometry(0.0035, 8, 6), new T.MeshBasicMaterial({ color: 0x9ff3ff, depthTest: false }));
          dot.position.set(anchor[0], anchor[1], anchor[2]); line.renderOrder = dot.renderOrder = 19;
          grp.add(line, dot, sp); self.labelList.push({ sprite: sp, line: line, dot: dot, cat: cat });
        }
        var P = this.parts;
        label('Larynx', P.airway.g, 'AIRWAY', [0, 0.155, 0.018], [0.30, 0.19, 0]);
        label('Trachea', P.trachea.g, 'TRACHEA', [0.01, 0.07, -0.02], [0.30, 0.10, 0]);
        label('Left Bronchus', P.bronchiR.g, 'BRONCHI', [0.045, -0.034, -0.028], [0.34, 0.02, 0]);
        label('Heart System', P.heart.g, 'HEART', [0.05, -0.085, 0.06], [0.34, -0.085, 0]);
        label('Diaphragm', P.diaphragm.g, 'DIAPHRAGM', [0.10, -0.172, 0.0], [0.34, -0.23, 0]);
        label('Right Bronchus', P.bronchiR.g, 'BRONCHI', [-0.030, -0.040, -0.028], [-0.34, -0.02, 0]);
        label('Alveolar Network Path', P.bronchiR.g, 'LUNGS', [-0.105, -0.141, 0.025], [-0.34, -0.14, 0]);
        var exh = textSprite('Exhalation ↑', { w: 280, h: 56, sw: 0.13, font: 26, color: '#aef4ff' });
        exh.position.set(0.17, 0.40, 0.22); P.airway.g.add(exh); this.exhale = exh;

        var rl = [0, -0.40, 0, 0, 0.46, 0];
        for (var ty = -0.40; ty <= 0.461; ty += 0.05) rl.push(0, ty, 0, (Math.abs(ty * 10 - Math.round(ty * 10)) < 0.01 ? 0.03 : 0.015), ty, 0);
        var rg = new T.BufferGeometry(); rg.setAttribute('position', new T.Float32BufferAttribute(rl, 3));
        var ruler = new T.LineSegments(rg, new T.LineBasicMaterial({ color: 0x2f8fb0, transparent: true, opacity: 0.8, depthWrite: false }));
        ruler.position.set(-0.48, 0, 0); this.hud.add(ruler);
        [-0.3, -0.2, -0.1, 0, 0.1, 0.2, 0.3, 0.4].forEach(function (y) {
          var s = textSprite((y * 100).toFixed(0) + ' cm', { w: 160, h: 40, sw: 0.07, font: 22, color: '#7fd0e8' });
          s.position.set(-0.545, y, 0); self.hud.add(s);
        });

        var down = null;
        function bind() {
          if (bind.done || !sc.canvas) return; bind.done = true;
          function ray(e) {
            var r = sc.canvas.getBoundingClientRect();
            pickRay.setFromCamera(new T.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), sc.camera);
            return pickRay;
          }
          sc.canvas.addEventListener('mousedown', function (e) { down = [e.clientX, e.clientY]; });
          sc.canvas.addEventListener('mousemove', function (e) {
            if (sc.is('vr-mode') || down) return;
            var rc = ray(e); self.hoverFrom(rc.ray.origin, rc.ray.direction);
          });
          sc.canvas.addEventListener('mouseup', function (e) {
            var moved = down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5; down = null;
            if (moved || sc.is('vr-mode')) return;
            var rc = ray(e), L = loco();
            if (L && L.dialogOpen) pickDialog(rc.ray.origin, rc.ray.direction); else self.click(rc.ray.origin, rc.ray.direction);
          });
        }
        sc.addEventListener('render-target-loaded', bind); if (sc.canvas) bind();
      },

      toggleAnchor: function () {},

      followModel: function () {
        var rc = this.el.components['museum-rig']; if (!rc || rc.R === null) return;
        var s = clamp(0.82 * rc.R / 0.95, 0.55, 3), th = rc.theta, side = rc.subject.r * 1.1 + 0.2 * s + 0.12 * s;
        this.group.scale.setScalar(s);
        this.group.rotation.y = th - 0.22;
        this.group.position.set(rc.c.x - side * Math.cos(th), rc.c.y + 0.05 * s, rc.c.z + side * Math.sin(th));
      },

      targets: function () {
        var list = [this.panel], m = model();
        if (m) m.labelList.forEach(function (l) { if (l.sprite.visible) list.push(l.sprite); });
        return list;
      },
      cast: function (o, d) {
        pickRay.set(o, d); pickRay.camera = this.el.sceneEl.camera;
        var hit = null; try { hit = pickRay.intersectObjects(this.targets(), false)[0] || null; } catch (e) {}
        return hit;
      },
      hoverFrom: function (o, d) {
        return this.hoverHit(this.cast(o, d));
      },
      hoverHit: function (hit) {
        var id = null, L = loco();
        if (L && L.dialogOpen) hit = null;
        APP.hover = hit && hit.object.isSprite ? hit.object : null;
        if (hit && hit.object === this.panel) id = hitPanel(hit);
        if (id !== this.hoverId) {
          this.hoverId = id; this.dirty = true;
          if (id) this.haptic();
        }
        return hit;
      },
      click: function (o, d) {
        var hit = this.cast(o, d); if (!hit) return;
        if (hit.object === this.panel) {
          var id = hitPanel(hit); if (!id) return;
          this.flash[id === 'scaleUp' || id === 'scaleDown' ? 'scale' : id] = performance.now();
          if (id !== 'scale') act(id);
        } else if (hit.object.isSprite && hit.object.userData.cat) {
          var cat = hit.object.userData.cat; setIso(APP.iso === cat ? 'ALL' : cat); dirtyPanel();
        }
        this.haptic(0.7, 40);
      },
      haptic: function (i, ms) { var p = this.el.components['museum-pointer']; if (p) p.buzz(null, i, ms); },
      // Reset-dialog hits use the same laser: the two buttons are meshes, so they can be raycast directly
      castDialog: function (o, d) {
        pickRay.set(o, d);
        var yes = $('dlg-yes').getObject3D('mesh'), no = $('dlg-no').getObject3D('mesh');
        return yes && no ? pickRay.intersectObjects([yes, no], false)[0] || null : null;
      },

      draw: function () {
        var g = this.canvas.getContext('2d'), now = performance.now();
        g.clearRect(0, 0, PW, PH);
        g.fillStyle = 'rgba(8,18,32,0.78)'; g.strokeStyle = '#00e5ff'; g.lineWidth = 4;
        g.beginPath(); g.roundRect(4, 4, PW - 8, PH - 8, 34); g.fill(); g.stroke();
        g.textBaseline = 'middle'; g.textAlign = 'center';
        g.fillStyle = '#00e5ff'; g.font = '700 31px system-ui, sans-serif'; g.fillText('RESPIRATORY XR', PW / 2, 46);
        g.fillStyle = '#7fb8c8'; g.font = '500 20px system-ui, sans-serif';
        g.fillText(this.el.sceneEl.is('vr-mode') ? 'POINT EITHER HAND, PULL ITS TRIGGER' : 'CLICK A BUTTON', PW / 2, 82);
        g.fillStyle = '#00e5ff'; g.font = '700 21px system-ui, sans-serif'; g.fillText('FOCUS AN ORGAN', PW / 2, 124);
        for (var i = 0; i < BTNS.length; i++) {
          var b = BTNS[i]; if (b.show && !b.show()) continue;
          var hov = this.hoverId && (this.hoverId === b.id || (b.id === 'scale' && /^scale/.test(this.hoverId)));
          var fl = this.flash[b.id] && now - this.flash[b.id] < 220, on = b.on && b.on(), dim = b.dim && b.dim();
          g.fillStyle = fl ? 'rgba(0,229,255,0.55)' : hov ? 'rgba(0,229,255,0.28)' : on ? 'rgba(0,229,255,0.16)' : 'rgba(20,48,72,0.7)';
          g.strokeStyle = hov || on ? '#00e5ff' : '#2f6f8c'; g.lineWidth = hov ? 4 : 2.5;
          g.beginPath(); g.roundRect(b.x, b.y, b.w, b.h, 16); g.fill(); g.stroke();
          g.fillStyle = dim ? '#58798a' : '#eafcff'; g.font = '700 22px system-ui, sans-serif'; g.fillText(b.label(), b.x + b.w / 2, b.y + b.h / 2 + 1);
          if (b.id === 'scale') { g.font = '700 40px system-ui, sans-serif'; g.fillStyle = '#00e5ff';
            g.fillText('−', b.x + 30, b.y + b.h / 2 - 2); g.fillText('+', b.x + b.w - 30, b.y + b.h / 2 - 2); g.textAlign = 'center'; }
        }
        // caption, function line and the task tracker for the focused organ
        var foc = APP.iso !== 'ALL', y = 968;
        function wrap(text, x, font, color, lh) {
          g.font = font; g.fillStyle = color; var words = text.split(' '), line = '';
          words.forEach(function (w) {
            var test = line ? line + ' ' + w : w;
            if (g.measureText(test).width > PW - 72 && line) { g.fillText(line, x, y); y += lh; line = w; } else line = test;
          });
          g.fillText(line, x, y); y += lh;
        }
        g.textAlign = 'left'; g.fillStyle = '#00e5ff'; g.font = '700 22px system-ui, sans-serif';
        g.fillText(foc ? APP.iso + ' IN FOCUS' : 'WHOLE BODY', 36, y); y += 34;
        wrap(CAPTION[APP.iso], 36, '500 22px system-ui, sans-serif', '#cfeff7', 29);
        if (foc) {
          y += 4;
          if (APP.func) wrap(FUNC_TEXT[APP.iso], 36, '500 20px system-ui, sans-serif', '#ffd88a', 27);
          y += 6; g.fillStyle = '#00e5ff'; g.font = '700 20px system-ui, sans-serif'; g.fillText('YOUR TASKS', 36, y); y += 30;
          var pct = Math.min(100, Math.floor(APP.orbitAcc / TWO_PI * 100)), o1 = pct >= 100;
          g.font = '600 21px system-ui, sans-serif';
          g.fillStyle = o1 ? '#7dffb2' : '#cfeff7'; g.fillText((o1 ? '✓ ' : '○ ') + 'Circle it (stick to the side): ' + pct + '%', 36, y); y += 30;
          g.fillStyle = APP.funcDone ? '#7dffb2' : '#cfeff7'; g.fillText((APP.funcDone ? '✓ ' : '○ ') + 'Run its function (FUNCTION button)', 36, y); y += 34;
          if (APP.focusDone) { g.fillStyle = '#7dffb2'; g.font = '700 22px system-ui, sans-serif'; g.fillText('FOCUS COMPLETE. PICK THE NEXT ORGAN.', 36, y); }
        }
        g.fillStyle = '#5b8fa0'; g.font = '500 18px system-ui, sans-serif';
        var ps = this.el.components['museum-pointer'], st = ps && ps.status, vr = this.el.sceneEl.is('vr-mode');
        g.fillText('PANEL FOLLOWS THE MODEL' + (vr ? '   HANDS: L ' + (st && st.l ? 'ON' : 'OFF') + '  R ' + (st && st.r ? 'ON' : 'OFF') : ''), 36, PH - 28);
        this.tex.needsUpdate = true;
      },

      tick: function () {
        this.followModel();
        var self = this, p = this.el.components['museum-pointer'];
        if (p && !this.wired) {                                // both hands point; either trigger clicks
          this.wired = true;
          p.setHandlers({
            cast: function (o, d) { var L = loco(); return L && L.dialogOpen ? self.castDialog(o, d) : self.cast(o, d); },
            hover: function (hit) { self.hoverHit(hit); },
            click: function (o, d, h) {
              var L = loco();
              if (L && L.dialogOpen) pickDialog(o, d); else self.click(o, d);
              p.buzz(h, 0.7, 40);
            }
          });
        }
        if (p && this.el.sceneEl.is('vr-mode')) { var st = p.status || {}, key = (st.l ? 1 : 0) + (st.r ? 2 : 0); if (key !== this._st) { this._st = key; this.dirty = true; } }
        if (this.dirty || Object.keys(this.flash).length) {
          this.draw(); this.dirty = false;
          var now = performance.now(), f = this.flash;
          for (var k in f) if (now - f[k] > 260) { delete f[k]; this.dirty = true; }
        }
      }
    });

    // ---------------------------------------------------------------
    // Reset dialog (A.8)
    // ---------------------------------------------------------------
    function openDialog() {
      var L = loco(), d = $('dialog');
      if (!L || L.dialogOpen) return;
      var cam = $('cam').object3D, p = new T.Vector3(), q = new T.Quaternion(), f = new T.Vector3(0, 0, -1);
      cam.getWorldPosition(p); cam.getWorldQuaternion(q); f.applyQuaternion(q); f.y = 0;
      if (f.lengthSq() < 1e-4) f.set(0, 0, -1);
      f.normalize();
      d.object3D.position.set(p.x + f.x * 1.4, p.y - 0.1, p.z + f.z * 1.4);
      d.object3D.lookAt(p.x, p.y - 0.1, p.z);
      d.object3D.visible = true;
      L.dialogOpen = L.paused = true;
    }
    function closeDialog() {
      var L = loco(), d = $('dialog');
      if (!L || !L.dialogOpen) return;
      d.object3D.visible = false; L.dialogOpen = L.paused = false;
    }
    function resetAll() { closeDialog(); loco().reset(); }

    // ---- status for the flat view ----
    var statusEl = $('status');
    window.addEventListener('error', function (e) { statusEl.textContent = 'Error: ' + e.message; statusEl.className = 'error'; });
    // ?shot=1 freezes a mid-inhale frame and hides the page overlays, for the portfolio images
    window.__afterModel = function () {
      if (!QS.get('shot')) return;
      document.body.classList.add('shot');
      var m = model(); m.breath = function () { return { ph: 0, u: 0.62, vol: 0.62 }; };
      APP.explodeIdx = parseInt(QS.get('explode')) || 0; APP.iso = QS.get('iso') || 'ALL'; APP.preset = QS.get('view') || 'clinical';
      var rc = rigC(); rc.frameTo(parseFloat(QS.get('frame')) || 4.6, parseFloat(QS.get('lift')) || 0.3); rc.theta = (parseFloat(QS.get('th')) || 0) * Math.PI / 180; rc.R = null;
      dirtyPanel();
    };
  </script>
</body>
