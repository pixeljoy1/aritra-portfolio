<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kolkata Street: monsoon tram scene</title>
<!-- Pinned A-Frame release. WebXR needs HTTPS; GitHub Pages provides it. -->
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<style>
  /* A street scene under monsoon overcast. One committed dark overlay over a
     3D view, so the palette is fixed rather than theme-switched. */
  :root {
    color-scheme: dark;
    --panel: rgba(10, 12, 16, .74);
    --ink: #f2f5f9;
    --ink-dim: #9aa6b4;
    --accent: #ffcf7a;
    --rule: rgba(255, 255, 255, .09);
    --bg: #0b0c0e;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --gutter-l: max(12px, env(safe-area-inset-left, 0px));
    --gutter-r: max(12px, env(safe-area-inset-right, 0px));
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  a-scene { position: fixed; inset: 0; }

  .panel {
    position: fixed; z-index: 10; background: var(--panel); border-radius: 8px;
    backdrop-filter: blur(6px);
  }
  #hud {
    left: var(--gutter-l); top: calc(52px + env(safe-area-inset-top, 0px));
    padding: 8px 12px; font-size: 13px; line-height: 1.45; max-width: 42ch;
    pointer-events: none;
  }
  #hud.error { background: #8d1b16; }
  #views {
    right: var(--gutter-r); top: calc(12px + env(safe-area-inset-top, 0px));
    width: 254px; font-size: 12px; line-height: 1.4; overflow: hidden;
    max-height: calc(100% - 28px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  }
  #views h2 {
    margin: 0; padding: 9px 12px 7px; font-size: 11px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--accent); font-weight: 600;
  }
  #views button {
    display: block; width: 100%; text-align: left; padding: 7px 12px;
    font: inherit; color: var(--ink); background: none; border: 0;
    border-top: 1px solid var(--rule); cursor: pointer;
  }
  #views button:hover, #views button:focus-visible { background: rgba(255,255,255,.13); }
  #views button span { color: var(--ink-dim); }
  #keys {
    left: var(--gutter-l); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    right: var(--gutter-r); max-width: 56ch; padding: 9px 12px;
    font-size: 12px; line-height: 1.55; color: #c7cdd6;
  }
  #keys b { color: var(--ink); font-weight: 600; }
  #prog {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 11; width: min(340px, 72vw); padding: 14px 16px 16px;
    text-align: center; font-size: 13px; line-height: 1.4;
  }
  #prog-label { margin-bottom: 10px; }
  #prog-track {
    height: 4px; background: rgba(255,255,255,.16); border-radius: 2px;
    overflow: hidden;
  }
  #prog-fill {
    height: 100%; width: 1%; background: var(--accent); border-radius: 2px;
    transition: width .25s ease;
  }
  #back {
    left: var(--gutter-l); top: calc(12px + env(safe-area-inset-top, 0px));
    padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--accent);
    text-decoration: none; letter-spacing: .02em;
  }
  #back:hover, #back:focus-visible { background: rgba(255,255,255,.16); }
  #stepper {
    right: var(--gutter-r); bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 2px; overflow: hidden; font-size: 13px;
  }
  #stepper button {
    font: inherit; font-weight: 600; color: var(--ink); background: none; border: 0;
    padding: 9px 14px; cursor: pointer;
  }
  #stepper button + button { border-left: 1px solid var(--rule); }
  #stepper button:hover, #stepper button:focus-visible { background: rgba(255,255,255,.16); }
  @media (max-width: 760px) { #views { display: none; } #keys { font-size: 11px; right: 96px; } #stepper { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); } }
</style>
</head>
<body>


<div id="hud" class="panel">Loading the street...</div>
<a id="back" class="panel" href="../experiences/kolkata-street-vr/">&larr; Portals</a>
<div id="prog" class="panel">
  <div id="prog-label">Loading the street</div>
  <div id="prog-track"><div id="prog-fill"></div></div>
</div>
<div id="views" class="panel" hidden><h2>Viewpoints</h2></div>
<div id="keys" class="panel" hidden>
  <b>W A S D</b> walk &nbsp; <b>drag</b> to look &nbsp; <b>Shift</b> run &nbsp;
  <b>F</b> walk/fly &nbsp; <b>E Q</b> up/down &nbsp;
  <b>1...0</b> viewpoints &nbsp; <b>V</b> next &nbsp; <b>R</b> reset &nbsp;
  <b>T</b> run the trams
  <br><b>In VR</b> &mdash; left stick walk, right stick snap-turn, trigger run, <b>A</b> walk/fly, <b>X</b> next viewpoint, <b>B/Y</b> reset.
</div>
<div id="stepper" class="panel" hidden>
  <button type="button" id="prev" aria-label="Previous viewpoint">&#9664; View</button>
  <button type="button" id="next" aria-label="Next viewpoint">View &#9654;</button>
</div>

<a-scene
    renderer="colorManagement: true; antialias: true; toneMapping: ACESFilmic;
              highRefreshRate: true"
    fog="type: linear; color: #ccd3dc; near: 26; far: 235"
    background="color: #d7dde4"
    street-environment
    city-builder="src: layout.json"
    shadow="type: pcfsoft">

  <!-- Monsoon overcast: a big soft key from the north-west and a strong sky
       fill. Matches the Blender sun at 56 deg from vertical, 118 deg round. -->
  <a-entity light="type: hemisphere; color: #d8e1ec; groundColor: #4c463c;
                   intensity: 2.2"></a-entity>
  <a-entity id="sun"
            light="type: directional; color: #fff4e4; intensity: 2.1;
                   castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048;
                   shadowCameraLeft: -46; shadowCameraRight: 46;
                   shadowCameraTop: 46; shadowCameraBottom: -46;
                   shadowCameraFar: 220; shadowBias: -0.0012"
            position="73 56 -39"></a-entity>

  <a-entity id="city"></a-entity>

  <a-entity id="rig" position="-25 0 4.6" street-rig>
    <a-entity id="head" camera="near: 0.05; far: 265" position="0 1.62 0"
              look-controls="pointerLockEnabled: false; magicWindowTrackingEnabled: true"
              wasd-controls="enabled: false">
      <a-entity id="helppanel" position="0 0 -1.15" visible="false">
        <a-plane width="1.26" height="0.60" color="#0b0e12" opacity="0.86"
                 material="shader: flat"></a-plane>
        <a-text id="helptext" value="" align="center" width="1.15"
                color="#e8edf4" position="0 0 0.01"></a-text>
      </a-entity>
    </a-entity>
    <a-entity id="handL" meta-touch-controls="hand: left"
              oculus-touch-controls="hand: left" vr-input="hand: left"></a-entity>
    <a-entity id="handR" meta-touch-controls="hand: right"
              oculus-touch-controls="hand: right" vr-input="hand: right"></a-entity>
  </a-entity>
</a-scene>

<script src="street.js?v=1.02"></script>

</body>
</html>
